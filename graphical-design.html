/* ================================================================

/* ---------------- rendering ---------------- */

const RATIO = { tall: 1.38, square: 1.0, wide: 0.68 };

function plate(shape, colour, label) {
  // placeholder tile until real images are dropped in
  const h = Math.round(400 * RATIO[shape]);
  const svg =
    `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 ${h}'>` +
    `<rect width='400' height='${h}' fill='${colour}'/>` +
    `<rect width='400' height='${h}' fill='rgba(0,0,0,.18)'/>` +
    `<text x='200' y='${h/2}' font-family='Helvetica' font-size='15' fill='rgba(255,255,255,.5)' ` +
    `text-anchor='middle' letter-spacing='2'>${label}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

// column count chosen per image count so the mosaic reads as a tidy grid
// rather than a lot of empty or overcrowded cells
function mosaicCols(n) {
  if (n <= 1) return 1;
  if (n === 2) return 2;
  if (n === 4) return 2;
  return 3;
}

function mosaicFor(project) {
  const hasImages = project.images.length > 0;
  const n = hasImages ? project.images.length : 4;
  const cols = mosaicCols(n);
  // if the last row doesn't divide evenly, stretch its final image
  // across the leftover columns rather than leaving an empty cell —
  // the mosaic should always fully cover the card. With a single
  // image (cols=1) this is a no-op: it just fills the whole card.
  const remainder = n % cols;
  const lastSpan = remainder === 0 ? 1 : cols - remainder + 1;

  const cells = hasImages
    ? project.images.map((src, i) => {
        const span = (i === n - 1 && remainder !== 0) ? lastSpan : 1;
        return `<img src="${src}" alt="" loading="lazy" style="animation-delay:${i * 55}ms; grid-column: span ${span};">`;
      }).join('')
    : Array.from({ length: n }, (_, i) =>
        `<div style="animation-delay:${i * 55}ms"></div>`).join('');
  return `<div class="mosaic" style="grid-template-columns:repeat(${cols},1fr)">${cells}</div>`;
}

function buildCard(project, colour, onClick) {
  const card = document.createElement('div');
  card.className = 'card';
  const img = project.images[0]
    ? project.images[0]
    : plate(project.shape, colour, project.title);

  card.innerHTML =
    `<img class="plate" src="${img}" alt="${project.title}">` +
    mosaicFor(project) +
    `<div class="veil"><h3>${project.title}</h3><p>${project.oneline}</p></div>`;

  card.addEventListener('click', () => onClick(project));
  return card;
}

/* level 2 */
const stageCat = document.getElementById('stage-cat');
function openCategory(key) {
  const cat = DATA[key];
  stageCat.style.background = cat.color;
  document.getElementById('cat-kicker').textContent = 'Category';
  document.getElementById('cat-title').textContent = cat.title;
  document.getElementById('cat-blurb').textContent = cat.blurb;

  const grid = document.getElementById('cat-grid');
  grid.innerHTML = '';
  cat.projects.forEach(p => {
    grid.appendChild(buildCard(p, cat.color, proj => openProject(proj, cat)));
  });

  stageCat.classList.add('open');
  stageCat.scrollTop = 0;
}

/* level 3 */
const stageProj = document.getElementById('stage-proj');
function openProject(project, cat) {
  stageProj.style.background = cat.color;
  document.getElementById('proj-kicker').textContent = cat.title;
  document.getElementById('proj-title').textContent = project.title;
  document.getElementById('proj-blurb').textContent = project.text;

  const grid = document.getElementById('proj-grid');
  grid.innerHTML = '';

  // every image from this project, same masonry layout
  const shots = project.images.length ? project.images : [null, null, null, null, null];
  const shapes = ['tall','square','wide','square','tall','wide'];
  shots.forEach((src, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    const shape = shapes[i % shapes.length];
    card.innerHTML = `<img class="plate" src="${src || plate(shape, cat.color, project.title + ' ' + (i+1))}" alt="">`;
    grid.appendChild(card);
  });

  stageProj.classList.add('open');
  stageProj.scrollTop = 0;
}

/* the cutting page calls this when a piece is cut:
     openCategory('logotypes' | 'illustration' | 'photography' | 'fashion')  */
window.openCategory = openCategory;

/* closing */
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById(btn.dataset.close).classList.remove('open');
  });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (stageProj.classList.contains('open')) stageProj.classList.remove('open');
    else stageCat.classList.remove('open');
  }
});


  // ---- cutting page ----
  const resetBtn = document.getElementById('reset');

  // measure each cut path so the line draws itself rather than fading in
  document.querySelectorAll('.piece .cut').forEach(path => {
    const len = path.getTotalLength();
    path.style.setProperty('--len', len);
  });

  document.querySelectorAll('.piece').forEach(piece => {
    piece.addEventListener('click', () => {
      const colour = piece.dataset.color;

      if (!piece.classList.contains('opened')) {
        piece.classList.add('opened');
        resetBtn.classList.add('show');
      }
      setTimeout(checkComplete, 60);

      // once the piece has lifted, open that category's grid
      setTimeout(() => {
        window.openCategory(piece.dataset.cat);
      }, 520);
    });
  });

  resetBtn.addEventListener('click', () => {
    document.querySelectorAll('.piece.opened').forEach(p => p.classList.remove('opened'));
    resetBtn.classList.remove('show');
    checkComplete();
  });


  // ---- sewing sequence ----
  const sewTrigger = document.getElementById('sew-trigger');
  const sewStage   = document.getElementById('sew-stage');
  const sewCaption = document.getElementById('sew-caption');
  const revealPhoto = document.getElementById('reveal-photo');
  const flyingHat  = document.getElementById('flying-hat');
  const aboutCopy  = document.getElementById('about-copy');
  const sewSvg     = document.getElementById('sew-svg');

  const seams = ['seam-1','seam-2','seam-3'].map(id => document.getElementById(id));
  seams.forEach(s => {
    const len = s.getTotalLength();
    s.style.strokeDasharray = `7 6`;
    s.dataset.len = len;
    s.style.opacity = 0;
  });

  function allCut() {
    return document.querySelectorAll('.piece.opened').length === document.querySelectorAll('.piece').length;
  }

  function checkComplete() {
    sewTrigger.classList.toggle('show', allCut());
  }

  function runSewing() {
    sewStage.classList.add('on');
    revealPhoto.classList.remove('show');
    flyingHat.classList.remove('landed');
    aboutCopy.classList.remove('show');
    sewSvg.style.display = '';
    seams.forEach(s => s.style.opacity = 0);

    // pieces start scattered, then move into place
    const scatter = {
      'sp-brim':    'translate(0px, 150px)',
      'sp-band':    'translate(-190px, 20px)',
      'sp-crown-b': 'translate(190px, -30px)',
      'sp-crown-a': 'translate(0px, -170px)'
    };
    Object.entries(scatter).forEach(([id, tf]) => {
      const el = document.getElementById(id);
      el.style.transition = 'none';
      el.style.transform = tf;
      el.style.opacity = 0;
    });
    // force reflow so the scattered position registers before animating
    sewSvg.getBoundingClientRect();

    setTimeout(() => {
      sewCaption.textContent = 'Joining the seams';
      sewCaption.classList.add('show');
      Object.keys(scatter).forEach(id => {
        const el = document.getElementById(id);
        el.style.transition = 'transform 1100ms cubic-bezier(.34,.02,.2,1), opacity 500ms ease';
        el.style.transform = 'translate(0px, 0px)';
        el.style.opacity = 1;
      });
    }, 250);

    // seams stitch one at a time
    seams.forEach((s, i) => {
      setTimeout(() => {
        s.style.opacity = .9;
        s.style.strokeDasharray = s.dataset.len;
        s.style.strokeDashoffset = s.dataset.len;
        s.getBoundingClientRect();
        s.style.transition = 'stroke-dashoffset 600ms ease';
        s.style.strokeDashoffset = 0;
        setTimeout(() => {
          s.style.transition = 'none';
          s.style.strokeDasharray = '7 6';
          s.style.strokeDashoffset = 0;
        }, 620);
      }, 1400 + i * 650);
    });

    // hat is finished — hand it to the portrait
    setTimeout(() => {
      sewCaption.textContent = 'Finished';
    }, 3500);

    setTimeout(() => {
      sewCaption.classList.remove('show');
      sewSvg.style.display = 'none';
      revealPhoto.classList.add('show');
    }, 4100);

    setTimeout(() => {
      flyingHat.classList.remove('landed');
      flyingHat.getBoundingClientRect();
      requestAnimationFrame(() => flyingHat.classList.add('landed'));
    }, 4500);

    setTimeout(() => {
      aboutCopy.classList.add('show');
    }, 5300);
  }

  sewTrigger.addEventListener('click', runSewing);

  document.getElementById('sew-close').addEventListener('click', () => {
    sewStage.classList.remove('on');
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      sewStage.classList.remove('on');
    }
  });
</script>

</body>
</html>
